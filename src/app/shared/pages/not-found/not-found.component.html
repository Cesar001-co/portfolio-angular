<section class="mx-auto flex min-h-[calc(100svh-var(--app-header-height))] max-w-2xl flex-col items-center justify-center gap-6 px-4 py-16 text-center">
  <div class="flex flex-col items-center gap-3">
    <p class="text-sm font-semibold tracking-widest text-primary uppercase">404</p>
    <h1 class="text-4xl font-bold tracking-tight text-color sm:text-5xl">{{ 'notFound.title' | translate }}</h1>
    <p class="max-w-md leading-relaxed text-muted-color">{{ 'notFound.message' | translate }}</p>
  </div>

  <!-- Lulu: 600px (versión optimizada del original de 2000px) -->
  <img ngSrc="assets/not_found_600.png" width="600" height="900" priority
    class="h-72 w-auto drop-shadow-2xl sm:h-80" [alt]="'notFound.dogAlt' | translate" />

  <div class="flex flex-wrap justify-center gap-3">
    <a routerLink="/" class="btn btn-primary btn-lg rounded-lg">
      <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5M11 18l-6-6 6-6" />
      </svg>
      {{ 'common.backHome' | translate }}
    </a>
    <a routerLink="/projects" class="btn btn-ghost btn-lg rounded-lg">{{ 'notFound.projects' | translate }}</a>
  </div>
</section>
