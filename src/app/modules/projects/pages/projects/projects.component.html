<section class="mx-auto max-w-6xl px-4 py-16 sm:px-6">
  <a routerLink="/" class="mb-8 inline-flex items-center gap-2 text-sm text-muted-color transition-colors hover:text-primary">
    <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M19 12H5M11 18l-6-6 6-6" />
    </svg>
    {{ 'common.backHome' | translate }}
  </a>

  <app-section-heading [title]="'projects.page.title' | translate" [subtitle]="'projects.page.subtitle' | translate" />

  <app-tech-filter class="mt-10" [techs]="techs" [(selected)]="selectedTech" />

  <!-- Conteo anunciado a lectores de pantalla al filtrar -->
  <p class="mt-6 text-sm text-muted-color" aria-live="polite">
    {{ 'projects.page.results' | translate: { count: projects().length } }}
  </p>

  <!-- Los chips salen de las tecnologías de los proyectos: cualquier filtro devuelve al menos uno -->
  <ul class="mt-4 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
    @for (project of projects(); track project.id) {
      <li><app-project-card [project]="project" /></li>
    }
  </ul>
</section>
