<section class="mx-auto grid max-w-6xl gap-14 px-4 py-24 sm:px-6 lg:grid-cols-[1.15fr_1fr] lg:gap-16">
  <!-- Sobre mí -->
  <div>
    <app-section-heading [title]="about.heading.title | translate" [subtitle]="about.heading.subtitle | translate" />

    <div class="mt-8 flex flex-col gap-5 leading-relaxed text-muted-color">
      <!-- Lista de párrafos del JSON de i18n; **énfasis** se renderiza con RichTextComponent -->
      @for (paragraph of about.paragraphsKey | translate; track $index) {
        <p><app-rich-text [text]="paragraph" /></p>
      }
    </div>
  </div>

  <!-- Servicios -->
  <div>
    <app-section-heading [title]="services.heading.title | translate" [subtitle]="services.heading.subtitle | translate" />

    <ul class="mt-8 flex flex-col gap-4">
      @for (service of services.items; track service.id) {
        <li class="card card-interactive flex items-start gap-4">
          <span class="flex size-11 shrink-0 items-center justify-center rounded-xl bg-accent-muted text-on-accent-muted" aria-hidden="true">
            <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              @switch (service.icon) {
                @case ('code') {
                  <path d="m16 18 6-6-6-6M8 6l-6 6 6 6" />
                }
                @case ('support') {
                  <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
                }
                @case ('web') {
                  <rect x="2" y="3" width="20" height="14" rx="2" />
                  <path d="M8 21h8M12 17v4" />
                }
              }
            </svg>
          </span>
          <div>
            <h3 class="font-semibold text-color">{{ 'services.items.' + service.id + '.title' | translate }}</h3>
            <p class="mt-1 text-sm leading-relaxed text-muted-color">{{ 'services.items.' + service.id + '.description' | translate }}</p>
          </div>
        </li>
      }
    </ul>
  </div>
</section>
